    Experience:
      - company: "GraphMAS: Multi-Agent Coordination for Graph Learning"
        position: Undergraduate Researcher, advised by Prof. Qiaoyu Tan
        location: NYU Shanghai
        start_date: 2026-05
        end_date: 2026-09
        highlights:
          - Proposed GraphMAS, a systematic framework for multi-agent graph learning, studying when specialized LLM agents benefit from complementary structural and semantic graph perspectives.
          - Built a unified benchmark spanning four coordination paradigms and seven methods across node classification and link prediction on seven graphs.
          - Developed instance-adaptive routing and optimized the coordination policy with PPO over frozen specialists, improving average LP accuracy from 79.6% to 87.3% and NC accuracy from 68.4% to 72.4%.

      - company: Generalizable Search Agents for General and Deep Search
        position: Undergraduate Researcher, co-advised by Prof. Jinyang Li and Prof. Qiaoyu Tan
        location: NYU
        start_date: 2026-04
        highlights:
          - Identified a generalization gap between agents optimized for retrieval-based QA and long-horizon deep search.
          - Exploring unified search agents that jointly learn from general- and deep-search trajectories with SFT and RL-based policy optimization.
          - Built a controlled evaluation framework across PopQA, 2WikiMultiHopQA, BrowseComp, and BrowseComp-ZH.

      - company: "OMG-VLM: One Model, Many Graphs with Vision-Language Models"
        position: Undergraduate Researcher, advised by Prof. Qiaoyu Tan
        location: NYU Shanghai
        start_date: 2025-03
        end_date: 2026-05
        highlights:
          - Introduced unified attributed graph learning under heterogeneous modality schemas (text-, image-, and multimodal-attributed graphs).
          - Proposed OMG-VLM, a generative framework using a pretrained VLM as a shared backbone with target-aware textual aggregation and graph-aware visual representation learning.
          - Outperformed the strongest baselines by 3.38 points on in-domain graphs and 15.09 points on unseen graphs (EMNLP 2026).

